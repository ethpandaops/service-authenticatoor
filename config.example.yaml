# authenticatoor — example configuration
#
# Loaded from the path passed via --config (default: /etc/authenticatoor/config.yaml).
# Every field can also be set via env var: AUTHENTICATOOR_<UPPER_PATH> with
# dots replaced by underscores. For example, signing.rs256.privateKeyFile
# becomes AUTHENTICATOOR_SIGNING_RS256_PRIVATEKEYFILE.

# ─── server ───────────────────────────────────────────────────────────────────

# Bind address. Default: ":8080".
listen: ":8080"

# REQUIRED. The canonical URL of this service. Used as the JWT "iss" claim.
# Several other fields are derived from this when not configured explicitly:
#   - audience          → the parent zone (i.e. with the "auth." stripped)
#   - scopePattern      → "*.<parent zone>"
#   - allowedReturnHosts → ["*.<parent zone>"]
#   - cors.allowedOrigins → same as allowedReturnHosts
issuer: "https://auth.example.com"

# Optional. URL used in the OIDC discovery document and in the jwks_uri.
# Defaults to the issuer URL.
# externalURL: "https://auth.example.com"

# ─── token shape ──────────────────────────────────────────────────────────────

# The "aud" claim. Verifiers must accept this value. Defaults to the parent
# zone of the issuer host.
# audience:
#   - "example.com"

# The "scope" claim — a host wildcard pattern. Verifiers match their own
# externally visible host against this pattern. Defaults to "*.<parent zone>".
# scopePattern: "*.example.com"

# Token lifetime. Default: "30m".
tokenTTL: "30m"

# ─── browser-callback / CORS allow-list ───────────────────────────────────────

# Hosts that the /auth/login endpoint will redirect to via `return_to`.
# Patterns use the same DNS-label glob syntax as scopePattern. Defaults to
# ["*.<parent zone of issuer>"].
# allowedReturnHosts:
#   - "*.example.com"

# Browsers that are allowed to call /auth/* with credentials via CORS. Defaults
# to allowedReturnHosts.
# cors:
#   allowedOrigins:
#     - "*.example.com"

# ─── auth providers ───────────────────────────────────────────────────────────

# All providers defined in the `providers` list are enabled: they all
# authenticate requests, and their login routes are always reachable.
#
# authMode: string | string list. Names the provider(s) actively
# ADVERTISED to unauthenticated users, by instance name. With a single
# entry, unauthenticated /auth/* requests go straight into that
# provider's login flow; with several, they land on the /login provider
# selection page listing exactly these entries (in this order). Providers
# left out stay fully functional via their direct /<name>/login paths —
# they just aren't offered. Unset = advertise all defined providers.
# Env override accepts a comma-separated value
# (AUTHENTICATOOR_AUTHMODE="cfaccess,oidc").
authMode: cfaccess

# providers: the provider instances. Each entry has a required, unique
# `name`, a `type`, and the type's config block. All interactive routes
# live under the instance's own path prefix:
#
#   /<name>/login      — login entry (authenticates, mints a signed session
#                        cookie, redirects back via return_to)
#   /<name>/callback   — OAuth/OIDC callback (github / oidc types)
#   /<name>/token      — machine token alias (cloudflare type only): same
#                        JSON contract as /auth/token, authenticated purely
#                        from the ambient CF headers — keep this path behind
#                        the CF Access application so service tokens work
#                        without redirects.
#
# On each /auth/* request every active provider passively inspects the
# credentials already present (session cookie, ambient CF headers, Basic
# Authorization header) and the first match wins. /auth/* itself needs NO
# edge protection — only the cloudflare type's /cfaccess/* prefix does. An
# edge that (still) covers /auth/* keeps working: the CF headers
# authenticate ambiently and the login redirect never triggers.
#
# Session cookies are HMAC-signed with per-provider keys derived from the
# JWT signing key — no separate session secret to manage.
#
# Teams: every type block takes `teams`, a static list put into the
# token's "teams" claim for every identity that provider authenticates
# (e.g. [panda] on a Cloudflare Access door only staff can pass), and
# `teamRules`, which derive teams from the attributes the provider
# verified about the user:
#
#   teamRules:
#     - claim: groups           # attribute (dotted path for nested ones)
#       prefix: "team:"         # value starts with it → the rest is the team
#     - claim: groups
#       map:                    # whole value → teams; * = any run of characters
#         ethpandaops: [panda]
#         "ethpandaops:*": [panda]
#     - claim: department
#       regex: "^eng-([a-z0-9-]+)$"   # RE2, one capture group = the team
#     - claim: realm_access.roles
#       value: true             # every value is itself a team
#     - claim: scope
#       split: " "              # split a string into several values first
#       prefix: "team-"
#     - claim: email
#       map: { "alice@example.org": [lighthouse] }
#
# Attributes: oidc — every id_token claim; cloudflare — every Access
# token claim plus `principal` (user | service); github — login, email,
# orgs; basic / any — username. A rule sets exactly one of prefix / map /
# regex / value; an unknown, empty or missing key is a startup error,
# never "every value is a team". Names taken from a value must already be
# lowercase [a-z0-9][a-z0-9._-]{0,62} — nothing is trimmed or lowercased.
# A token carries the teams of the provider that authenticated the
# request, never a union across providers. An invalid name or rule in the
# config fails startup. See docs/config.md (Teams).
providers:
  # Cloudflare Access: the edge authenticates and injects identity headers.
  # verifyJWT (default true) verifies the Cf-Access-Jwt-Assertion against
  # the team's JWKS — strongly recommended. allowServiceTokens (default
  # true) lets non-identity CF service tokens authenticate with their
  # common_name as subject.
  - name: cfaccess
    type: cloudflare
    cloudflareAccess:
      teamDomain: "<team>.cloudflareaccess.com"
      # The AUD tag of this Access application. Optional. When set,
      # assertions whose aud doesn't match are rejected. When empty,
      # signature + issuer still tie the assertion to the Cloudflare team
      # — but to ANY of its Access applications: the teams and grants of
      # this provider then apply to everyone admitted to any of them, and
      # the service says so in a startup warning.
      # audTag: ""
      # verifyJWT: true
      # allowServiceTokens: true
      # jwtHeader: "Cf-Access-Jwt-Assertion"
      # userHeader: "Cf-Access-Authenticated-User-Email"
      # sessionCookieName: "authenticatoor_cfaccess_session"
      # sessionTTL: "12h"   # CF policy re-checked only on cookie expiry
      # Static teams for everyone (and every service token) passing this
      # door. Read from the config on every request, so a change applies
      # to existing sessions after a restart.
      # teams: [door]
      # Staff team for people only, not for service tokens:
      # teamRules:
      #   - claim: principal
      #     map: { user: [panda] }

  # HTTP Basic auth backed by an htpasswd file. Self-contained. An
  # Authorization header on /auth/* authenticates directly; the login
  # entry converts credentials into a session cookie (needed alongside
  # other providers).
  # - name: htpasswd
  #   type: basic
  #   basicAuth:
  #     htpasswdFile: "/etc/authenticatoor/htpasswd"
  #     realm: "authenticatoor"
  #     # sessionCookieName: "authenticatoor_htpasswd_session"
  #     # sessionTTL: "12h"
  #     # teams: [panda]        # static teams for every htpasswd user
  #     # teamRules:            # attribute: username
  #     #   - claim: username
  #     #     map: { alice: [lighthouse] }

  # DEV ONLY: a form where the user picks any username.
  # - name: anyauth
  #   type: any
  #   anyAuth:
  #     # cookieName: "authenticatoor_anyauth_user"
  #     # cookieTTL:  "12h"
  #     # teams: [panda]        # static teams for ANY username — dev only

  # GitHub OAuth with org-membership gating. Register the OAuth app's
  # redirect URI as <issuer>/github/callback. Mount clientSecret from a
  # Kubernetes Secret in production; the inline variant accepts the value
  # via env var for ad-hoc deployments.
  # - name: github
  #   type: github
  #   githubOAuth:
  #     clientId: "Iv1.…"
  #     clientSecretFile: "/etc/authenticatoor/gh-secret"
  #     sessionTTL: "12h"
  #     allowedOrgs:
  #       - "ethpandaops"
  #     # callbackPath: "/github/callback"
  #     # sessionCookieName: "authenticatoor_github_session"
  #     # stateCookieName: "authenticatoor_github_state"
  #     # Static teams for every user of this provider.
  #     # teams: [devnet]
  #     # Teams by org membership (attributes: login, email, orgs). Uses
  #     # the orgs already fetched for allowedOrgs; captured at login and
  #     # kept until the session expires.
  #     # teamRules:
  #     #   - claim: orgs
  #     #     map:
  #     #       ethpandaops: [panda]
  #     #       sigp: [lighthouse]

  # Standard OIDC against any IdP (designed against the central
  # ethpandaops dex + oidc-relay; see docs/config.md for the relay/state
  # contract). callbackURL is the relay's URL, or
  # <externalURL>/oidc/callback for direct (relay-less) deployments.
  # Group membership is checked against the id_token `groups` claim.
  # Same type twice is fine — give each instance its own name, e.g. a
  # second entry trusting a different IdP.
  # - name: oidc
  #   type: oidc
  #   oidc:
  #     issuerURL: "https://dex.primary.production.platform.ethpandaops.io"
  #     callbackURL: "https://oidc-relay.primary.production.platform.ethpandaops.io/oidc/callback"
  #     clientId: "authenticatoor"
  #     clientSecretFile: "/etc/authenticatoor/oidc-client-secret"
  #     sessionTTL: "12h"
  #     allowedGroups:
  #       - "ethpandaops"
  #       - "EthDevOpsAccess:validatorops"
  #     # callbackPath: "/oidc/callback"
  #     # sessionCookieName: "authenticatoor_oidc_session"
  #     # stateCookieName: "authenticatoor_oidc_state"
  #     # scopes: ["openid", "email", "groups"]
  #     # The id_token's email counts only with email_verified: true.
  #     # Without it the IdP's sub is the identity and there is no email
  #     # (earlier versions used the email regardless). Leave the key out
  #     # and the service warns about this at startup; false keeps the
  #     # rule and silences the warning; true is only for an IdP that
  #     # verifies emails but does not say so.
  #     # trustUnverifiedEmail: false
  #     # Non-browser clients: GET /<name>/token accepts
  #     # "Authorization: Bearer <JWT of the IdP>" and answers like
  #     # /auth/token. Off unless the block is there. audiences lists
  #     # the IdP client ids whose tokens are accepted — a dedicated
  #     # client whose tokens go to authenticatoor instances only (never
  #     # defaulted to clientId). issuerURL only when that client has
  #     # another issuer than the one above. See docs/config.md,
  #     # "Non-browser clients", and docs/cli-clients.md.
  #     # bearer:
  #     #   audiences: ["devnet-cli"]
  #     #   # issuerURL: "https://idp.example.org/application/o/devnet-cli/"
  #     # Static teams for every user of this provider.
  #     # teams: [devnet]
  #     # Teams from the id_token (any claim; nested ones by dotted path).
  #     # Captured at login and kept until the session expires.
  #     # teamRules:
  #     #   - claim: groups
  #     #     prefix: "team:"         # "team:lighthouse" → lighthouse
  #     #   - claim: groups
  #     #     map:                    # groups without the prefix
  #     #       ethpandaops: [panda]
  #     #       "ethpandaops:*": [panda]

# Legacy form (deprecated): when `providers` is empty, authMode entries
# name provider TYPES and the matching top-level blocks are converted
# into provider entries (with names cloudflare→cfaccess, basic→htpasswd,
# any→anyauth, github→github, oidc→oidc) — an old config with
# `authMode: cloudflare` plus a top-level `cloudflareAccess:` block keeps
# working unchanged. Prefer the providers list for new configs.

# ─── service grants ───────────────────────────────────────────────────────────

# Teams say who you are; grants say what you may use. `grants` is a list
# of groups; an identity gets the union of the `services` of every group
# it is a member of. When set, each token's "services" claim is computed
# from it:
#
#   grants include `all`      → "+all"
#   dora and spamoor          → "-all,+dora,+spamoor"
#   in no group               → "-all"  (token still minted; tools that
#                                        check their service refuse it)
#
# A member names the door and what the door vouched for:
#
#   <provider>/team:<team>          the team, as that provider resolves it
#                                   (its `teams` and `teamRules`)
#   <provider>/user:<id>            the token's sub or email at that provider;
#                                   an id with an "@" matches only an email
#                                   the provider verified, never a raw
#                                   subject that looks like one
#   <provider>/<attribute>:<value>  any attribute that provider verified,
#                                   by the names teamRules use:
#                                   oidc/groups:panda-access,
#                                   github/orgs:ethpandaops,
#                                   cfaccess/principal:user
#
# <provider> is a `name` from the providers list — always required: the
# same team or id through another provider is somebody else. Matching is
# exact (ASCII case-insensitive for ids and values); no wildcards — to
# grant by a pattern, make it a team with a teamRules entry.
#
# Read from the config at every mint, so a change applies to existing
# sessions after a restart (attribute members: at the user's next login
# for oidc/github). Absent (the default): no per-identity constraint
# — every authenticated identity gets tokens valid for every service
# (basic access only: no default-deny feature of any tool),
# and the service warns about that at startup when several providers or
# any teams are configured. `grants: []` grants nothing to anyone.
#
# Only tools that verify with their own name as ExpectedService (spamoor,
# assertoor; buildoor once its branch pk910/services-gate is merged)
# enforce the claim; others accept any valid token.
#
# Features: naming a service grants BASIC access to it; a grant can add
# named features of the tool on top. Positive forms only — "-svc" or
# "svc:-f1" is a startup error (the grants of several groups are a union,
# so a denial would depend on their order).
#
#   svc            basic access to svc
#   svc:f1:f2      basic + features f1, f2    → "-all,+svc,+svc:f1:f2"
#   svc:user*      basic + every feature whose name starts with "user"
#                  (a trailing * only; a lone * is `all`)
#   svc:all        basic + every feature      → "-all,+svc,+svc:all"
#   all            basic access to every service             → "+all"
#   all:f1         every service: basic + f1                 → "+all,+all:f1"
#   all:all        everything, every feature                 → "+all,+all:all"
#
# The bare "+svc" is always emitted next to a feature directive, so tools
# built before features existed keep reading basic access correctly.
# A group with the bare service gets the tool's default-allow features and
# none of its default-deny (privileged) ones; a single default-allow
# feature cannot be taken away per group. Give the internal team all:all —
# a bare `all` stops being enough once a tool requires a privileged
# feature. See docs/config.md (Features).
# grants:
#   - name: staff
#     members: ["cfaccess/team:panda", "oidc/team:ethpandaops"]
#     services: ["all:all"]
#   - name: internal-tooling
#     members: ["oidc/groups:panda-access"]
#     services: [assertoor]
#   - name: client-devs
#     members: ["oidc/team:lighthouse", "oidc/team:geth"]
#     services: ["dora:admin", "spamoor:user*"]
#   - members: ["oidc/user:alice@example.org"]
#     services: ["dora:reindex"]

# ─── signing keys ─────────────────────────────────────────────────────────────

signing:
  mode: rs256
  rs256:
    # PEM-encoded RSA-2048+ private key, PKCS#1 or PKCS#8.
    privateKeyFile: "/etc/authenticatoor/keys/private.pem"
    # Optional. Defaults to a SHA-256 hash of the public key.
    # keyId: "k1"
    # If true and the file is missing, generate a new key on startup. DEV ONLY —
    # production deployments must use a Kubernetes Secret with a stable key.
    generateIfMissing: false
    # During key rotation, list the previous public keys here so verifiers can
    # still validate already-issued tokens until they expire. Drop entries
    # after `tokenTTL` has passed.
    # previousKeys:
    #   - keyId: "k0"
    #     publicKeyFile: "/etc/authenticatoor/keys/k0.pub.pem"

# ─── observability ────────────────────────────────────────────────────────────

logging:
  level: info       # debug | info | warn | error
  format: text      # text | json

metrics:
  enabled: false
  listen: ":9090"
