# Keys that earlier versions read: githubOAuth.sessionSecret and
# githubOAuth.sessionSecretFile.
issuer: "https://auth.example.com"
authMode: github
githubOAuth:
  clientId: "Iv1.0000000000000000"
  clientSecretFile: "/etc/authenticatoor/gh-secret"
  sessionSecret: "not-a-real-secret"
  sessionSecretFile: "/etc/authenticatoor/gh-session-secret"
  allowedOrgs:
    - "ethpandaops"
signing:
  rs256:
    privateKeyFile: "/etc/authenticatoor/keys/private.pem"
